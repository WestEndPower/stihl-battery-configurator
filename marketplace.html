<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Equipment</title>
<meta name="description" content="Shop and compare equipment by category, brand, power source, availability and specifications.">
<style>
:root{--ink:#171a1d;--muted:#66707a;--line:#d9dee3;--soft:#f6f8f9;--accent:#238b45;--accent2:#176c34;--max:1740px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
button,input{font:inherit}button{cursor:pointer}
.market-shell{max-width:var(--max);margin:auto;padding:18px}
.market-header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.market-branding{display:flex;align-items:center;gap:14px;min-width:0}.market-branding img{max-width:210px;max-height:58px;object-fit:contain}.market-branding h1{margin:0;font-size:clamp(22px,3vw,34px)}.market-branding p{margin:3px 0 0;color:var(--muted)}
.market-searchbox{display:flex;align-items:center;gap:8px;min-width:min(420px,38vw)}.market-searchbox input{width:100%;padding:11px 13px;border:1px solid #aeb6bf;border-radius:9px}.market-clear{border:1px solid #333;border-radius:8px;background:#fff;padding:10px 12px;font-weight:800}
.market-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.65fr);gap:14px;margin:16px 0}.market-top-panel{border:1px solid var(--line);border-radius:11px;background:var(--soft);padding:12px}
.market-top-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.market-top-title strong{font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.market-chip-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.market-chip{border:1px solid #3f474f;border-radius:999px;background:#fff;padding:8px 12px;font-weight:800}.market-chip.active{background:var(--ink);color:#fff}.market-context-label{font-size:12px;font-weight:900;text-transform:uppercase;color:var(--muted);margin-right:2px}
#market-context,#market-width{margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.market-layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:18px;align-items:start}
.market-sidebar{position:sticky;top:10px;border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden}.market-sidebar h2{font-size:17px;margin:0;padding:14px 14px 10px}.market-sidebar details{border-top:1px solid var(--line)}.market-sidebar summary{list-style:none;padding:12px 14px;font-weight:900;cursor:pointer;display:flex;justify-content:space-between}.market-sidebar summary:after{content:'+'}.market-sidebar details[open] summary:after{content:'−'}.market-sidebar summary::-webkit-details-marker{display:none}.market-checks{padding:0 14px 12px;display:grid;gap:8px}.market-checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px}.market-checks input{margin-top:2px}
.market-main{min-width:0}.market-results{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;color:var(--muted)}.market-results strong{color:var(--ink)}
.market-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:stretch}.market-card{display:flex;flex-direction:column;min-width:0;overflow:hidden;border:2px solid #bcc3ca;border-radius:11px;background:linear-gradient(145deg,#fff 0%,#fbfcfd 42%,#f1f3f5 100%);box-shadow:0 3px 10px rgba(0,0,0,.09);padding:9px}.market-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;margin-bottom:8px;padding:7px 9px;border:1px solid #196b34;border-radius:7px;background:#238b45;color:#fff}.market-card-head h3{display:flex;align-items:baseline;gap:7px;min-width:0;margin:0}.market-card-head h3 strong{font-size:20px;line-height:1;font-weight:900;white-space:nowrap}.market-card-head h3 span{font-size:13px;line-height:1;font-weight:700;color:#eef5f0;white-space:nowrap}.market-compare-pick{display:flex;align-items:center;gap:4px;flex:0 0 auto;padding:4px 8px;border:1px solid #e2e5e8;border-radius:999px;background:#fff;color:#252a2e;font-size:10px;font-weight:900;white-space:nowrap}.market-compare-pick input{width:auto;margin:0}
.market-card-body{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:10px;align-items:stretch}.market-card-left{display:flex;flex-direction:column;min-width:0}.market-image{display:flex;align-items:center;justify-content:center;width:100%;min-height:250px;overflow:hidden;border:1px solid #cfd4da;border-radius:7px;background:linear-gradient(180deg,#fff,#f8fafb);color:var(--muted);text-decoration:none}.market-image img{display:block;width:100%;height:250px;object-fit:contain;padding:8px}.market-product-details{display:flex;justify-content:center;margin:8px auto 0;width:max-content;max-width:100%;font-size:12px;font-weight:800;color:#235c37;text-decoration:none;text-align:center}.market-product-details:hover{text-decoration:underline}
.market-buy{display:flex;flex-direction:column;gap:6px;min-width:0;height:100%}.market-price-lines{display:flex;flex-direction:column;gap:6px}.market-price-choice{padding:9px 10px;border:1px solid #cfd4da;border-radius:7px;background:linear-gradient(180deg,#fff,#fafbfc);box-shadow:0 1px 3px rgba(0,0,0,.04)}.market-price-choice.market-package-choice{border-color:#ddb3b9;background:linear-gradient(180deg,#fff,#fff8f8)}.market-price-heading{display:flex;align-items:baseline;justify-content:space-between;gap:7px;white-space:nowrap}.market-price-heading>span:first-child{font-size:18px;font-weight:900}.market-price-pair{display:flex;align-items:baseline;justify-content:flex-end;gap:5px}.market-price-pair del{font-size:12px;color:#666}.market-price-pair strong{font-size:21px;font-weight:900;color:#c8102e}.market-price-choice small{display:block;margin-top:6px;text-align:center;font-size:12.5px;line-height:1.2;color:#5d6670;font-weight:800}.market-package-includes{color:#333!important}.market-series{font-size:12px;font-weight:800;color:var(--muted);text-align:center}.market-availability{font-size:12px;font-weight:900;color:#1e6f39;text-align:center}.market-cart-controls{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:6px}.market-cart-controls select,.market-cart-controls input{min-width:0;width:100%;height:40px;padding:7px 9px;border:1px solid #c4cbd2;border-radius:6px;background:#fff;font-size:14px;font-weight:700}.market-cart-controls input{text-align:center}.market-cart-controls button{grid-column:1/3;min-height:36px;border:1px solid var(--accent2);border-radius:6px;background:var(--accent);color:#fff;font-weight:900}.market-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.market-actions a{display:flex;align-items:center;justify-content:center;min-height:34px;padding:5px 6px;border:1px solid #25313c;border-radius:6px;background:#fff;color:#202832;text-decoration:none;font-size:12px;font-weight:900}.market-actions a:only-child{grid-column:1/3}
.market-specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:9px 0 0}.market-specs div{display:flex;flex-direction:column;justify-content:center;min-height:52px;padding:7px 8px;border:1px solid #d8dde2;border-radius:7px;background:#fff}.market-specs dt{font-size:10px;color:#6a727a;text-align:center}.market-specs dd{margin:2px 0 0;font-size:12px;font-weight:900;text-align:center}
.market-empty{grid-column:1/-1;text-align:center;padding:60px 20px;border:1px dashed #aaa;border-radius:10px}.market-empty h2{margin:0 0 6px}
.market-compare-float{position:fixed;right:92px;bottom:18px;z-index:20;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:13px 18px;font-weight:900;box-shadow:0 6px 20px rgba(0,0,0,.22)}.market-compare-float:disabled{opacity:.45;cursor:not-allowed}.market-cart-float{position:fixed;right:18px;bottom:18px;z-index:21;display:flex;align-items:center;gap:7px;border-radius:999px;background:var(--accent);color:#fff;padding:11px 14px;text-decoration:none;font-weight:900;box-shadow:0 6px 20px rgba(0,0,0,.22)}.market-cart-float svg{width:21px;height:21px}.market-cart-float sup{min-width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#fff;color:#111;font-size:10px;line-height:1}
#market-compare-dialog{width:min(1200px,94vw);max-height:88vh;border:0;border-radius:12px;padding:0;box-shadow:0 18px 60px rgba(0,0,0,.3)}#market-compare-dialog::backdrop{background:rgba(0,0,0,.52)}.market-dialog-head{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}.market-dialog-head h2{margin:0}.market-dialog-head button{border:0;background:#eee;border-radius:50%;width:38px;height:38px;font-size:24px}.market-compare-content{padding:0 14px 16px}.market-compare-scroll{overflow:auto;max-height:72vh}.market-compare-scroll table{border-collapse:separate;border-spacing:0;min-width:100%}.market-compare-scroll th,.market-compare-scroll td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px;min-width:150px;vertical-align:top}.market-compare-scroll thead th{position:sticky;top:0;background:#202428;color:#fff;z-index:2}.market-compare-scroll tbody th{position:sticky;left:0;background:#f3f5f6;z-index:1;text-align:left}
#market-loading{max-width:900px;margin:80px auto;padding:30px;text-align:center;border:1px solid var(--line);border-radius:12px}
@media(max-width:1120px){.market-grid{grid-template-columns:1fr}.market-top{grid-template-columns:1fr}.market-searchbox{min-width:300px}}
@media(max-width:760px){.market-shell{padding:10px}.market-header{align-items:stretch;flex-direction:column}.market-searchbox{min-width:0;width:100%}.market-layout{grid-template-columns:1fr}.market-sidebar{position:static}.market-sidebar details:not([open]) .market-checks{display:none}.market-grid{grid-template-columns:1fr}.market-card-body{grid-template-columns:1fr}.market-top{margin:10px 0}.market-compare-float{right:10px;bottom:10px}.market-branding img{max-width:160px}.market-specs{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="market-loading">Loading product catalog…</div>
<div id="market-app" class="market-shell" hidden>
  <header class="market-header">
    <div class="market-branding">
      <img id="market-dealer-logo" hidden alt="">
      <div><h1>Shop Equipment</h1><p id="market-dealer-name"></p></div>
    </div>
    <div class="market-searchbox">
      <input id="market-search" type="search" placeholder="Search model, category, specification…">
      <button id="market-clear" class="market-clear" type="button">Clear</button>
    </div>
  </header>

  <section class="market-top" aria-label="Primary product filters">
    <div class="market-top-panel">
      <div class="market-top-title"><strong>Category</strong><span>Choose what you are shopping for</span></div>
      <div id="market-categories" class="market-chip-row"></div>
      <div id="market-width" class="market-chip-row" hidden></div>
    </div>
    <div class="market-top-panel">
      <div class="market-top-title"><strong>Power Type</strong><span>Then narrow the platform</span></div>
      <div id="market-power" class="market-chip-row"></div>
      <div id="market-context" class="market-chip-row" hidden></div>
    </div>
  </section>

  <div class="market-layout">
    <aside class="market-sidebar" aria-label="Product filters">
      <h2>Filter Products</h2>
      <details open><summary>Brand</summary><div id="filter-brand" class="market-checks"></div></details>
      <details><summary>Availability</summary><div id="filter-availability" class="market-checks"></div></details>
      <details><summary>Online Purchase</summary><div class="market-checks"><label><input id="filter-buy-online" type="checkbox"> <span>Buy online eligible</span></label></div></details>
      <div id="filter-specs-wrap"><div id="filter-specs"></div></div>
    </aside>

    <main class="market-main">
      <div class="market-results"><span><strong id="market-result-count">0</strong> product families<span id="market-result-context"></span></span><span>Workbook-driven catalog</span></div>
      <div id="market-grid" class="market-grid"></div>
    </main>
  </div>

  <button id="market-compare-float" class="market-compare-float" type="button">Compare Visible (0)</button>
  <a id="market-cart-float" class="market-cart-float" href="cart.html" aria-label="Open cart">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L20 8H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="19" r="1.5" fill="currentColor"/><circle cx="17" cy="19" r="1.5" fill="currentColor"/></svg>
    <span>Cart</span><sup id="market-cart-count"></sup>
  </a>

  <dialog id="market-compare-dialog">
    <div class="market-dialog-head"><h2>Compare Visible Products</h2><button id="market-compare-close" type="button" aria-label="Close">×</button></div>
    <div id="market-compare-content" class="market-compare-content"></div>
  </dialog>
</div>
<script src="universal/marketplace.js"></script>
</body>
</html>
